name: CI

"on":   # quoted: YAML 1.1 coerces a bare `on` to the boolean true
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck jq bats

      - name: Shell scripts are executable
        run: |
          fail=0
          for f in plugins/guardrails/hooks/*.sh scripts/*.sh install.sh \
                   plugins/team-power-pack/statusline/statusline.sh; do
            [ -x "$f" ] || { echo "not executable: $f"; fail=1; }
          done
          exit $fail

      - name: Shellcheck
        run: |
          shellcheck -S warning -x \
            plugins/guardrails/hooks/*.sh \
            plugins/guardrails/hooks/lib/*.sh \
            scripts/*.sh \
            install.sh \
            plugins/team-power-pack/statusline/statusline.sh

      - name: Hook tests
        run: bats tests/

      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/marketplace.json \
                   plugins/*/.claude-plugin/plugin.json \
                   plugins/guardrails/hooks/hooks.json \
                   plugins/guardrails/policies/*.json \
                   settings.example.json; do
            jq empty "$f" || { echo "invalid JSON: $f"; exit 1; }
          done

      - name: Every marketplace plugin resolves
        run: |
          fail=0
          for src in $(jq -r '.plugins[].source' .claude-plugin/marketplace.json); do
            [ -f "$src/.claude-plugin/plugin.json" ] || { echo "missing manifest: $src"; fail=1; }
          done
          exit $fail

      - name: Every wired hook exists and is executable
        run: |
          fail=0
          jq -r '.hooks | to_entries[] | .value[] | .hooks[] | .command' \
            plugins/guardrails/hooks/hooks.json \
          | sed 's|${CLAUDE_PLUGIN_ROOT}|plugins/guardrails|' \
          | sort -u \
          | while read -r c; do
              [ -x "$c" ] || { echo "hook not executable or missing: $c"; exit 1; }
            done || fail=1
          exit $fail

      - name: Setup audit
        run: ./scripts/doctor.sh .

      - name: Skill frontmatter
        run: |
          fail=0
          for f in plugins/*/skills/*/SKILL.md; do
            dir=$(basename "$(dirname "$f")")
            head -1 "$f" | grep -q '^---$' || { echo "$f: no frontmatter"; fail=1; continue; }
            fm=$(awk 'NR>1{ if ($0=="---") exit; print }' "$f")
            name=$(printf '%s' "$fm" | sed -n 's/^name:[[:space:]]*//p' | head -1)
            desc=$(printf '%s' "$fm" | sed -n 's/^description:[[:space:]]*//p' | head -1)
            [ "$name" = "$dir" ] || { echo "$f: name '$name' != directory '$dir'"; fail=1; }
            [ "${#desc}" -ge 30 ]   || { echo "$f: description too short"; fail=1; }
            [ "${#desc}" -le 1024 ] || { echo "$f: description over 1024 chars"; fail=1; }
            grep -q '^allowed-tools:' "$f" || { echo "$f: no allowed-tools"; fail=1; }
          done
          exit $fail

      - name: Agent frontmatter
        run: |
          fail=0
          for f in plugins/*/agents/*.md; do
            head -1 "$f" | grep -q '^---$' || { echo "$f: no frontmatter"; fail=1; continue; }
            fm=$(awk 'NR>1{ if ($0=="---") exit; print }' "$f")
            printf '%s' "$fm" | grep -q '^name:'        || { echo "$f: no name"; fail=1; }
            printf '%s' "$fm" | grep -q '^description:' || { echo "$f: no description"; fail=1; }
            model=$(printf '%s' "$fm" | sed -n 's/^model:[[:space:]]*//p' | head -1)
            case "$model" in
              ""|sonnet|opus|haiku|fable|inherit|claude-*) ;;
              *) echo "$f: unrecognized model '$model'"; fail=1 ;;
            esac
          done
          exit $fail

      - name: No emoji in shipped files
        run: |
          if grep -rlP '[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}]' plugins/ 2>/dev/null; then
            echo "emoji found in plugin files (see CONTRIBUTING.md)"
            exit 1
          fi

      - name: Internal links resolve
        run: |
          fail=0
          for f in README.md CONTRIBUTING.md docs/*.md; do
            grep -oE '\]\(([^)#:]+\.(md|json|sh|tape))\)' "$f" \
            | sed -E 's/^\]\(//; s/\)$//' \
            | while read -r link; do
                target=$(cd "$(dirname "$f")" && realpath -m "$link")
                [ -e "$target" ] || { echo "$f: broken link -> $link"; exit 1; }
              done || fail=1
          done
          exit $fail

      - name: Secret scan
        run: |
          if git grep -nE '(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{32,})' -- . ; then
            echo "possible credential committed"
            exit 1
          fi
